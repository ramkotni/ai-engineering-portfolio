[project]
name = "health-member-services-copilot"
version = "1.0.0"
description = "Evergreen Member Assist - multi-agent RAG copilot (LangGraph + LangChain), local Ollama/Chroma, deployable to AWS Bedrock AgentCore"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/prompts.py" = ["E501"]
"eval/run_eval.py" = ["E501"]
"docs/*.py" = ["E501", "F403", "F405"]
